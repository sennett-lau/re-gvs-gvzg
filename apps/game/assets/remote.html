<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gundam · Private play</title>
<style>
  :root { color-scheme: dark; font: 14px system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html,body { margin: 0; height: 100%; background: #07090e; color: #e5e9f1; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #141923; }
  #status { flex: 1; }
  button { font: inherit; color: inherit; border: 1px solid #34405a; border-radius: 8px; padding: 8px 12px; background: #263650; }
  button:disabled { opacity: .5; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #welcome { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; background: #090d16ed; padding: 24px; }
  #welcome[hidden], [hidden] { display: none !important; }
  #welcome section { width: min(100%,420px); }
  h1 { font-size: 28px; margin-bottom: 12px; }
  p { color: #b9c5d9; line-height: 1.6; }
  #join { width: 100%; margin-top: 16px; padding: 14px; background: #345fa0; }
  #controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px; touch-action: none; user-select: none; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .shoulders { display: flex; gap: 8px; }
  .shoulders button { min-width: 52px; }
  .face { display: grid; grid-template-columns: repeat(3,44px); grid-template-rows: repeat(3,44px); }
  .face button { padding: 0; border-radius: 50%; font-size: 20px; }
  .up { grid-area: 1/2; } .left { grid-area: 2/1; } .right { grid-area: 2/3; } .down { grid-area: 3/2; }
  #stick { width: 104px; height: 104px; border-radius: 50%; background: #1d2636b0; border: 1px solid #52617a; position: relative; touch-action: none; }
  #knob { position: absolute; left: 32px; top: 32px; width: 38px; height: 38px; border-radius: 50%; background: #7899c7; pointer-events: none; }
  button.on { background: #6888b8; }
  .middle { align-self: end; display: flex; gap: 6px; }
  @media (orientation: landscape) {
    #controls { position: fixed; inset: 40px 0 0; pointer-events: none; }
    .side { height: 100%; justify-content: space-between; pointer-events: auto; }
    .middle { pointer-events: auto; padding-bottom: env(safe-area-inset-bottom); }
    #controls button { background: #25344b99; border-color: #a9bdd266; }
    #controls button.on { background: #8bb0e099; }
  }
  @media (pointer:fine) { #controls { display: none; } }
</style>
</head>
<body>
<header><span id="status">Private session</span><button id="sound">Mute</button><button id="fullscreen">Fullscreen</button></header>
<div id="stage"><video id="video" autoplay playsinline></video></div>
<div id="controls">
  <div class="side"><div class="shoulders"><button data-bit="8">L2</button><button data-bit="10">L1</button></div>
    <div class="face"><button class="up" data-bit="4">▲</button><button class="left" data-bit="7">◀</button><button class="right" data-bit="5">▶</button><button class="down" data-bit="6">▼</button></div>
    <div id="stick"><span id="knob"></span></div>
  </div>
  <div class="middle"><button data-bit="0">Select</button><button data-bit="3">Start</button></div>
  <div class="side"><div class="shoulders"><button data-bit="11">R1</button><button data-bit="9">R2</button></div>
    <div class="face"><button class="up" data-bit="12">△</button><button class="left" data-bit="15">□</button><button class="right" data-bit="13">○</button><button class="down" data-bit="14">✕</button></div>
  </div>
</div>
<div id="welcome"><section><h1>Play together.</h1><p>Join the game running on your private host. Each device gets its own controller; both players see the shared game screen.</p><p>Keep the host page open. Use touch controls or a gamepad. Keyboard: arrows, Z/X/A/S, Enter.</p><p id="join-message"></p><button id="join">Join session</button></section></div>
<script src="remote-common.js"></script><script src="remote-client.js"></script>
</body>
</html>
