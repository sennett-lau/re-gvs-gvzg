<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" role="img" aria-label="From disc code to a running browser game"><title>From disc code to a running browser game</title><desc>Conceptual build and runtime flow, not a live compiler or a complete exported build recipe. Generated C++ preserves translated guest behavior. Browser execution still needs the runtime and access to the user&#39;s disc data.</desc><rect width="420" height="540" fill="var(--diagram-paper, #fcfcf8)"/><text x="24" y="35" fill="var(--diagram-ink, #223c32)" font-size="23" text-anchor="start" font-family="sans-serif">Disc → C++ → browser</text><rect x="24" y="70" width="372" height="65" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="107.5" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">1. User&#39;s disc</text><text x="210" y="123" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="middle" font-family="sans-serif">ELF + module archive</text><text x="210" y="156" fill="var(--diagram-accent, #b34f2c)" font-size="22" text-anchor="middle" font-family="sans-serif">↓</text><rect x="24" y="162" width="372" height="65" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="199.5" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">2. Extract + map</text><text x="210" y="215" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="middle" font-family="sans-serif">Code images + entry map</text><text x="210" y="248" fill="var(--diagram-accent, #b34f2c)" font-size="22" text-anchor="middle" font-family="sans-serif">↓</text><rect x="24" y="254" width="372" height="65" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="291.5" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">3. Recompile</text><text x="210" y="307" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="middle" font-family="sans-serif">Generated C++</text><text x="210" y="340" fill="var(--diagram-accent, #b34f2c)" font-size="22" text-anchor="middle" font-family="sans-serif">↓</text><rect x="24" y="346" width="372" height="65" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="383.5" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">4. Build for the web</text><text x="210" y="399" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="middle" font-family="sans-serif">JS + WASM + data</text><text x="210" y="432" fill="var(--diagram-accent, #b34f2c)" font-size="22" text-anchor="middle" font-family="sans-serif">↓</text><rect x="24" y="438" width="372" height="65" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="475.5" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">5. Run in a browser</text><text x="210" y="491" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="middle" font-family="sans-serif">Browser + runtime services</text></svg>
