<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" role="img" aria-label="Why both games wait for the input pair"><title>Why both games wait for the input pair</title><desc>Conceptual lockstep sequence, not a packet capture or latency measurement. k labels a gameplay tick. Checkpoints occur later at agreed ticks; the retained prototype checks every 120 ticks. Missing input waits; differing checkpoint hashes stop the session. There is no rollback.</desc><rect width="420" height="400" fill="var(--diagram-paper, #fcfcf8)"/><text x="24" y="34" fill="var(--diagram-ink, #223c32)" font-size="21" text-anchor="start" font-family="sans-serif">Both games need the input pair</text><rect x="24" y="65" width="174" height="50" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="111" y="95" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">P1 input</text><rect x="222" y="65" width="174" height="50" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="309" y="95" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">P2 input</text><path d="M111 115L210 160L309 115" fill="none" stroke="var(--diagram-accent, #b34f2c)" stroke-width="2"/><rect x="74" y="160" width="272" height="52" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="210" y="191" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">Shared P1 + P2 pair</text><text x="210" y="245" fill="var(--diagram-ink, #223c32)" font-size="17" text-anchor="middle" font-family="sans-serif">Missing input → wait</text><text x="210" y="277" fill="var(--diagram-ink, #223c32)" font-size="17" text-anchor="middle" font-family="sans-serif">Pair ready → advance locally</text><text x="210" y="322" fill="var(--diagram-muted, #637064)" font-size="16" text-anchor="middle" font-family="sans-serif">Later: compare checkpoint hashes</text><text x="210" y="355" fill="var(--diagram-accent, #b34f2c)" font-size="17" text-anchor="middle" font-family="sans-serif">Different hashes → stop</text></svg>
