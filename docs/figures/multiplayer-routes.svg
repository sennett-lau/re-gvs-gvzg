<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Where does the game run?"><title>Where does the game run?</title><desc>Two multiplayer architectures, not a claim of finished integration. Streaming sends the same game&#39;s media to both players. Independent clients each run the game and exchange inputs; the current prototype uses a local two-player fixture, not the restored original online mode.</desc><text x="30" y="30" fill="#223c32" font-size="21" text-anchor="start" font-family="sans-serif">Where does the game run?</text><text x="30" y="58" fill="#637064" font-size="13" text-anchor="start" font-family="sans-serif">WebRTC media + controller inputs</text><rect x="200" y="85" width="320" height="58" fill="#e9eddf" stroke="#9da995"/><text x="360" y="119" fill="#223c32" font-size="14" text-anchor="middle" font-family="sans-serif">One game + media encoder</text><rect x="20" y="195" width="300" height="48" fill="#e9eddf" stroke="#9da995"/><text x="170" y="224" fill="#223c32" font-size="14" text-anchor="middle" font-family="sans-serif">Player 1: video + controls</text><rect x="400" y="195" width="300" height="48" fill="#e9eddf" stroke="#9da995"/><text x="550" y="224" fill="#223c32" font-size="14" text-anchor="middle" font-family="sans-serif">Player 2: video + controls</text><path d="M280 143 L170 190 M440 143 L550 190" fill="none" stroke="#b34f2c" stroke-width="2"/><text x="360" y="177" fill="#b34f2c" font-size="24" text-anchor="middle" font-family="sans-serif">↕</text></svg>
