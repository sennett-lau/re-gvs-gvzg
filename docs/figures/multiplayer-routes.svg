<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Where does the game run?"><title>Where does the game run?</title><desc>Logical data flows, not finished integration. Streaming sends one game’s media to both players; its current transport uses TURN. Independent clients run the game locally and exchange inputs and checkpoints, without video. The fixture does not restore the original online mode.</desc><rect width="720" height="270" fill="var(--diagram-paper, #fcfcf8)"/><text x="30" y="30" fill="var(--diagram-ink, #223c32)" font-size="21" text-anchor="start" font-family="sans-serif">Where does the game run?</text><text x="30" y="58" fill="var(--diagram-muted, #637064)" font-size="13" text-anchor="start" font-family="sans-serif">WebRTC media + controller inputs</text><rect x="200" y="85" width="320" height="58" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="360" y="119" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">One game + media encoder</text><rect x="20" y="195" width="300" height="48" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="170" y="224" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">Player 1: video + controls</text><rect x="400" y="195" width="300" height="48" fill="var(--diagram-panel, #e9eddf)" stroke="var(--diagram-line, #9da995)"/><text x="550" y="224" fill="var(--diagram-ink, #223c32)" font-size="14" text-anchor="middle" font-family="sans-serif">Player 2: video + controls</text><path d="M280 143 L170 190 M440 143 L550 190" fill="none" stroke="var(--diagram-accent, #b34f2c)" stroke-width="2"/><text x="360" y="177" fill="var(--diagram-accent, #b34f2c)" font-size="24" text-anchor="middle" font-family="sans-serif">↕</text></svg>
