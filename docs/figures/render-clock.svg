<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Between two gameplay updates"><title>Between two gameplay updates</title><desc>Illustration only: a model moves from 0 to 10 units between two canonical updates. Interpolating a rendering copy adds intermediate poses; it does not add gameplay decisions. The implemented history-based approach adds about one 60-Hz tick of visual delay.</desc><text x="30" y="30" fill="#223c32" font-size="21" text-anchor="start" font-family="sans-serif">Between two gameplay updates</text><text x="30" y="58" fill="#637064" font-size="12" text-anchor="start" font-family="sans-serif">Gameplay: 60 Hz · retained previous/current state</text><line x1="70" y1="125" x2="650" y2="125" stroke="#9da995" stroke-width="2"/><circle cx="70" cy="125" r="17" fill="#f7f4ed" stroke="#223c32"/><circle cx="650" cy="125" r="17" fill="#f7f4ed" stroke="#223c32"/><circle cx="360" cy="125" r="11" fill="#b34f2c"/><text x="70" y="170" fill="#637064" font-size="13" text-anchor="middle" font-family="sans-serif">Previous: 0</text><text x="650" y="170" fill="#637064" font-size="13" text-anchor="middle" font-family="sans-serif">Current: 10</text><text x="360" y="205" fill="#b34f2c" font-size="14" text-anchor="middle" font-family="sans-serif">Render sample: 5.00 units</text></svg>
